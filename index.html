<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precise Lottie Eye Tracking Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Self-Hosted Local Lottie Player Script -->
    <script src="lottie-player.js"></script>
    <style>
        body {
            background-color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Cat Container (Sized cleanly) -->
    <div class="relative w-72 h-72 flex items-center justify-center">
        
        <!-- Lottie Player -->
        <lottie-player 
            src="kittey.json" 
            background="transparent" 
            speed="1" 
            style="width: 100%; height: 100%;" 
            loop 
            autoplay>
        </lottie-player>

        <!-- Mathematically Calculated Pupils from 1080x1080 Artboard Coordinates -->
        <div id="pupil-left" class="absolute w-2.5 h-2.5 bg-black rounded-full pointer-events-none" style="top: 28.2%; left: 19.9%;"></div>
        <div id="pupil-right" class="absolute w-2.5 h-2.5 bg-black rounded-full pointer-events-none" style="top: 28.2%; left: 33.6%;"></div>

    </div>

    <script>
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        function trackEyes() {
            const pLeft = document.getElementById('pupil-left');
            const pRight = document.getElementById('pupil-right');

            if (pLeft && pRight) {
                // Left Eye Tracking
                const rectLeft = pLeft.getBoundingClientRect();
                const eyeLeftX = rectLeft.left + rectLeft.width / 2;
                const eyeLeftY = rectLeft.top + rectLeft.height / 2;
                const angleLeft = Math.atan2(mouse.y - eyeLeftY, mouse.x - eyeLeftX);
                const distanceLeft = Math.min(3, Math.hypot(mouse.x - eyeLeftX, mouse.y - eyeLeftY) * 0.04);
                pLeft.style.transform = `translate(${Math.cos(angleLeft) * distanceLeft}px, ${Math.sin(angleLeft) * distanceLeft}px)`;

                // Right Eye Tracking
                const rectRight = pRight.getBoundingClientRect();
                const eyeRightX = rectRight.left + rectRight.width / 2;
                const eyeRightY = rectRight.top + rectRight.height / 2;
                const angleRight = Math.atan2(mouse.y - eyeRightY, mouse.x - eyeRightX);
                const distanceRight = Math.min(3, Math.hypot(mouse.x - eyeRightX, mouse.y - eyeRightY) * 0.04);
                pRight.style.transform = `translate(${Math.cos(angleRight) * distanceRight}px, ${Math.sin(angleRight) * distanceRight}px)`;
            }
            requestAnimationFrame(trackEyes);
        }

        requestAnimationFrame(trackEyes);
    </script>
</body>
</html>
