<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean & Balanced Eye Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="lottie-player.js"></script>
    <style>
        body {
            background-color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Cat Container -->
    <div id="cat-container" class="relative w-80 h-80 flex items-center justify-center">
        
        <lottie-player 
            src="kittey.json" 
            background="transparent" 
            speed="1" 
            style="width: 100%; height: 100%;" 
            loop 
            autoplay>
        </lottie-player>

        <!-- Your exact manually tuned visual centers -->
        <div id="pupil-left" class="absolute w-7 h-7 bg-black rounded-full pointer-events-none" style="top: 23%; left: 15%;"></div>
        <div id="pupil-right" class="absolute w-7 h-7 bg-black rounded-full pointer-events-none" style="top: 23%; left: 29%;"></div>

    </div>

    <script>
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        function trackEyes() {
            const pLeft = document.getElementById('pupil-left');
            const pRight = document.getElementById('pupil-right');

            if (pLeft && pRight) {
                const container = document.getElementById('cat-container');
                const cRect = container.getBoundingClientRect();

                // Calculate exact pixel screen coordinates based directly on your clean visual layout percentages
                const leftEyeX = cRect.left + (cRect.width * 0.15);
                const leftEyeY = cRect.top + (cRect.height * 0.23);
                
                const rightEyeX = cRect.left + (cRect.width * 0.29);
                const rightEyeY = cRect.top + (cRect.height * 0.23);

                // Unrestricted, balanced movement radius (adjust this max distance if you want them to travel further)
                const maxRadius = 14;

                // Left Eye Tracking
                const angleLeft = Math.atan2(mouse.y - leftEyeY, mouse.x - leftEyeX);
                const distLeft = Math.min(maxRadius, Math.hypot(mouse.x - leftEyeX, mouse.y - leftEyeY) * 0.12);
                pLeft.style.transform = `translate(${Math.cos(angleLeft) * distLeft}px, ${Math.sin(angleLeft) * distLeft}px)`;

                // Right Eye Tracking
                const angleRight = Math.atan2(mouse.y - rightEyeY, mouse.x - rightEyeX);
                const distRight = Math.min(maxRadius, Math.hypot(mouse.x - rightEyeY, mouse.y - rightEyeY) * 0.12);
                pRight.style.transform = `translate(${Math.cos(angleRight) * distRight}px, ${Math.sin(angleRight) * distRight}px)`;
            }
            requestAnimationFrame(trackEyes);
        }

        requestAnimationFrame(trackEyes);
    </script>
</body>
</html>
