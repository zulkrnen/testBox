<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free-Roaming Lottie Eye Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="lottie-player.js"></script>
    <style>
        body {
            background-color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Cat Container -->
    <div id="cat-container" class="relative w-80 h-80 flex items-center justify-center">
        
        <lottie-player 
            src="kittey.json" 
            background="transparent" 
            speed="1" 
            style="width: 100%; height: 100%;" 
            loop 
            autoplay>
        </lottie-player>

        <!-- Bold, large pupils positioned at their exact starting centers -->
        <div id="pupil-left" class="absolute w-5 h-5 bg-black rounded-full pointer-events-none" style="top: 28.2%; left: 19.9%;"></div>
        <div id="pupil-right" class="absolute w-5 h-5 bg-black rounded-full pointer-events-none" style="top: 28.2%; left: 33.6%;"></div>

    </div>

    <script>
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        function trackEyes() {
            const pLeft = document.getElementById('pupil-left');
            const pRight = document.getElementById('pupil-right');

            if (pLeft && pRight) {
                const container = document.getElementById('cat-container');
                const cRect = container.getBoundingClientRect();
                const scale = cRect.width / 1080;

                // Exact native eye centers
                const leftEyeX = cRect.left + (214.94 * scale);
                const leftEyeY = cRect.top + (304.74 * scale);
                
                const rightEyeX = cRect.left + (362.70 * scale);
                const rightEyeY = cRect.top + (304.74 * scale);

                // Maximum radius allowed before hitting the edge of the eye socket (generous bounds for full travel)
                const maxRadius = 14 * scale;

                // Left Eye Tracking (Unrestricted up to maxRadius)
                const angleLeft = Math.atan2(mouse.y - leftEyeY, mouse.x - leftEyeX);
                const distLeft = Math.min(maxRadius, Math.hypot(mouse.x - leftEyeX, mouse.y - leftEyeY) * 0.15);
                pLeft.style.transform = `translate(${Math.cos(angleLeft) * distLeft}px, ${Math.sin(angleLeft) * distLeft}px)`;

                // Right Eye Tracking (Unrestricted up to maxRadius)
                const angleRight = Math.atan2(mouse.y - rightEyeY, mouse.x - rightEyeX);
                const distRight = Math.min(maxRadius, Math.hypot(mouse.x - rightEyeY, mouse.y - rightEyeY) * 0.15);
                pRight.style.transform = `translate(${Math.cos(angleRight) * distRight}px, ${Math.sin(angleRight) * distRight}px)`;
            }
            requestAnimationFrame(trackEyes);
        }

        requestAnimationFrame(trackEyes);
    </script>
</body>
</html>
