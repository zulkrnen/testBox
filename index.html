<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie JSON Eye Tracking Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        body {
            background-color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Main Box -->
    <div class="relative w-64 h-64 flex items-center justify-center">
        
        <!-- Tight Inner Wrapper strictly sized to the cat asset -->
        <div id="cat-wrapper" class="relative w-36 h-36 flex items-center justify-center">
            <lottie-player 
                src="kitty.json" 
                background="transparent" 
                speed="1" 
                style="width: 100%; height: 100%;" 
                loop 
                autoplay>
            </lottie-player>

            <!-- Recalibrated Pupil Coordinates inside the inner wrapper -->
            <div id="pupil-left" class="absolute w-2 h-2 bg-black rounded-full pointer-events-none" style="top: 38%; left: 38%;"></div>
            <div id="pupil-right" class="absolute w-2 h-2 bg-black rounded-full pointer-events-none" style="top: 38%; left: 60%;"></div>
        </div>

    </div>

    <script>
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        function trackEyes() {
            const pLeft = document.getElementById('pupil-left');
            const pRight = document.getElementById('pupil-right');

            if (pLeft && pRight) {
                // Left Eye
                const rectLeft = pLeft.getBoundingClientRect();
                const eyeLeftX = rectLeft.left + rectLeft.width / 2;
                const eyeLeftY = rectLeft.top + rectLeft.height / 2;
                const angleLeft = Math.atan2(mouse.y - eyeLeftY, mouse.x - eyeLeftX);
                // Clamped short distance so it stays inside the eye socket
                const distanceLeft = Math.min(2.5, Math.hypot(mouse.x - eyeLeftX, mouse.y - eyeLeftY) * 0.04);
                pLeft.style.transform = `translate(${Math.cos(angleLeft) * distanceLeft}px, ${Math.sin(angleLeft) * distanceLeft}px)`;

                // Right Eye
                const rectRight = pRight.getBoundingClientRect();
                const eyeRightX = rectRight.left + rectRight.width / 2;
                const eyeRightY = rectRight.top + rectRight.height / 2;
                const angleRight = Math.atan2(mouse.y - eyeRightY, mouse.x - eyeRightX);
                const distanceRight = Math.min(2.5, Math.hypot(mouse.x - eyeRightX, mouse.y - eyeRightY) * 0.04);
                pRight.style.transform = `translate(${Math.cos(angleRight) * distanceRight}px, ${Math.sin(angleRight) * distanceRight}px)`;
            }
            requestAnimationFrame(trackEyes);
        }

        requestAnimationFrame(trackEyes);
    </script>
</body>
</html>
