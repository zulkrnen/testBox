<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Engineered Eye Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="lottie-player.js"></script>
    <style>
        body {
            background-color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Cat Container -->
    <div id="cat-container" class="relative w-80 h-80 flex items-center justify-center">
        
        <lottie-player 
            src="kittey.json" 
            background="transparent" 
            speed="1" 
            style="width: 100%; height: 100%;" 
            loop 
            autoplay>
        </lottie-player>

        <!-- Pupils perfectly centered via -50% translation matching your exact visual percentages -->
        <div id="pupil-left" class="absolute w-7 h-7 bg-black rounded-full pointer-events-none" style="top: 23%; left: 15%; transform: translate(-50%, -50%);"></div>
        <div id="pupil-right" class="absolute w-7 h-7 bg-black rounded-full pointer-events-none" style="top: 23%; left: 29%; transform: translate(-50%, -50%);"></div>

    </div>

    <script>
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        function trackEyes() {
            const pLeft = document.getElementById('pupil-left');
            const pRight = document.getElementById('pupil-right');

            if (pLeft && pRight) {
                const container = document.getElementById('cat-container');
                const cRect = container.getBoundingClientRect();

                // Exact pixel centers of the eyes based on your confirmed layout percentages
                const leftEyeX = cRect.left + (cRect.width * 0.15);
                const leftEyeY = cRect.top + (cRect.height * 0.23);
                
                const rightEyeX = cRect.left + (cRect.width * 0.29);
                const rightEyeY = cRect.top + (cRect.height * 0.23);

                // Maximum travel radius (strictly bounded to prevent escaping the socket)
                const maxRadius = cRect.width * 0.045; 

                // --- Left Eye Calculation ---
                const dxLeft = mouse.x - leftEyeX;
                const dyLeft = mouse.y - leftEyeY;
                const distLeft = Math.hypot(dxLeft, dyLeft);
                const angleLeft = Math.atan2(dyLeft, dxLeft);
                
                // Follows cursor up to maxRadius, then caps cleanly against the wall
                const travelLeft = Math.min(maxRadius, distLeft);
                const moveLeftX = Math.cos(angleLeft) * travelLeft;
                const moveLeftY = Math.sin(angleLeft) * travelLeft;

                // --- Right Eye Calculation ---
                const dxRight = mouse.x - rightEyeX;
                const dyRight = mouse.y - rightEyeY;
                const distRight = Math.hypot(dxRight, dyRight);
                const angleRight = Math.atan2(dyRight, dxRight);
                
                const travelRight = Math.min(maxRadius, distRight);
                const moveRightX = Math.cos(angleRight) * travelRight;
                const moveRightY = Math.sin(angleRight) * travelRight;

                // Apply transforms preserving the center alignment (-50%, -50%)
                pLeft.style.transform = `translate(calc(-50% + ${moveLeftX}px), calc(-50% + ${moveLeftY}px))`;
                pRight.style.transform = `translate(calc(-50% + ${moveRightX}px), calc(-50% + ${moveRightY}px))`;
            }
            requestAnimationFrame(trackEyes);
        }

        requestAnimationFrame(trackEyes);
    </script>
</body>
</html>
