<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Free-Roaming Eye Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="lottie-player.js"></script>
    <style>
        body {
            background-color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Cat Container -->
    <div id="cat-container" class="relative w-80 h-80 flex items-center justify-center">
        
        <lottie-player 
            src="kittey.json" 
            background="transparent" 
            speed="1" 
            style="width: 100%; height: 100%;" 
            loop 
            autoplay>
        </lottie-player>

        <!-- Bold, large w-7 pupils positioned closer to visual center -->
        <div id="pupil-left" class="absolute w-7 h-7 bg-black rounded-full pointer-events-none" style="top: 25.5%; left: 22.5%;"></div>
        <div id="pupil-right" class="absolute w-7 h-7 bg-black rounded-full pointer-events-none" style="top: 25.5%; left: 36.2%;"></div>

    </div>

    <script>
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        function trackEyes() {
            const pLeft = document.getElementById('pupil-left');
            const pRight = document.getElementById('pupil-right');

            if (pLeft && pRight) {
                const container = document.getElementById('cat-container');
                const cRect = container.getBoundingClientRect();
                const scale = cRect.width / 1080;

                // Shifted artboard coordinates to correct the bottom-right bias
                const leftEyeX = cRect.left + ((214.94 - 25) * scale);
                const leftEyeY = cRect.top + ((304.74 - 25) * scale);
                
                const rightEyeX = cRect.left + ((362.70 - 25) * scale);
                const rightEyeY = cRect.top + ((304.74 - 25) * scale);

                // Generous radius for full unrestricted roam inside the eyeball
                const maxRadius = 18 * scale;

                // Left Eye Tracking
                const angleLeft = Math.atan2(mouse.y - leftEyeY, mouse.x - leftEyeX);
                const distLeft = Math.min(maxRadius, Math.hypot(mouse.x - leftEyeX, mouse.y - leftEyeY) * 0.15);
                pLeft.style.transform = `translate(${Math.cos(angleLeft) * distLeft}px, ${Math.sin(angleLeft) * distLeft}px)`;

                // Right Eye Tracking
                const angleRight = Math.atan2(mouse.y - rightEyeY, mouse.x - rightEyeX);
                const distRight = Math.min(maxRadius, Math.hypot(mouse.x - rightEyeY, mouse.y - rightEyeY) * 0.15);
                pRight.style.transform = `translate(${Math.cos(angleRight) * distRight}px, ${Math.sin(angleRight) * distRight}px)`;
            }
            requestAnimationFrame(trackEyes);
        }

        requestAnimationFrame(trackEyes);
    </script>
</body>
</html>
