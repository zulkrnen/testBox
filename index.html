<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie JSON Eye Tracking Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Standard Lottie Web Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        body {
            background-color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="cat-container" class="relative w-64 h-64 flex items-center justify-center">
        <!-- Pointing directly to the raw JSON file -->
        <lottie-player 
            src="kitty.json" 
            background="transparent" 
            speed="1" 
            style="width: 100%; height: 100%;" 
            loop 
            autoplay>
        </lottie-player>

        <!-- Custom Black Pupils -->
        <div id="pupil-left" class="absolute w-2.5 h-2.5 bg-black rounded-full pointer-events-none" style="top: 47%; left: 39%;"></div>
        <div id="pupil-right" class="absolute w-2.5 h-2.5 bg-black rounded-full pointer-events-none" style="top: 47%; left: 61%;"></div>
    </div>

    <script>
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function trackEyes() {
            const pLeft = document.getElementById('pupil-left');
            const pRight = document.getElementById('pupil-right');

            if (pLeft && pRight) {
                const rectLeft = pLeft.getBoundingClientRect();
                const eyeLeftX = rectLeft.left + rectLeft.width / 2;
                const eyeLeftY = rectLeft.top + rectLeft.height / 2;
                const angleLeft = Math.atan2(mouse.y - eyeLeftY, mouse.x - eyeLeftX);
                const distanceLeft = Math.min(4, Math.hypot(mouse.x - eyeLeftX, mouse.y - eyeLeftY) * 0.05);
                pLeft.style.transform = `translate(${Math.cos(angleLeft) * distanceLeft}px, ${Math.sin(angleLeft) * distanceLeft}px)`;

                const rectRight = pRight.getBoundingClientRect();
                const eyeRightX = rectRight.left + rectRight.width / 2;
                const eyeRightY = rectRight.top + rectRight.height / 2;
                const angleRight = Math.atan2(mouse.y - eyeRightY, mouse.x - eyeRightX);
                const distanceRight = Math.min(4, Math.hypot(mouse.x - eyeRightX, mouse.y - eyeRightY) * 0.05);
                pRight.style.transform = `translate(${Math.cos(angleRight) * distanceRight}px, ${Math.sin(angleRight) * distanceRight}px)`;
            }
            requestAnimationFrame(trackEyes);
        }

        requestAnimationFrame(trackEyes);
    </script>
</body>
</html>
