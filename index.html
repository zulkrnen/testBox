<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineered Lottie Eye Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="lottie-player.js"></script>
    <style>
        body {
            background-color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Cat Container -->
    <div id="cat-container" class="relative w-80 h-80 flex items-center justify-center">
        
        <lottie-player 
            src="kittey.json" 
            background="transparent" 
            speed="1" 
            style="width: 100%; height: 100%;" 
            loop 
            autoplay>
        </lottie-player>

        <!-- Nicer, thicker pupils sized proportionally -->
        <div id="pupil-left" class="absolute w-3.5 h-3.5 bg-black rounded-full pointer-events-none transition-transform duration-75 ease-out" style="top: 28.2%; left: 19.9%;"></div>
        <div id="pupil-right" class="absolute w-3.5 h-3.5 bg-black rounded-full pointer-events-none transition-transform duration-75 ease-out" style="top: 28.2%; left: 33.6%;"></div>

    </div>

    <script>
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        function trackEyes() {
            const pLeft = document.getElementById('pupil-left');
            const pRight = document.getElementById('pupil-right');

            if (pLeft && pRight) {
                // Calculate based on the container center to ensure top-left corner tracking works seamlessly
                const container = document.getElementById('cat-container');
                const cRect = container.getBoundingClientRect();
                
                // Absolute pixel centers of the eyes based on your 1080p layout mapped to current container width
                const scale = cRect.width / 1080;
                
                // Native eye centers from 1080x1080 artboard
                const leftEyeNativeX = 214.94;
                const leftEyeNativeY = 304.74;
                const rightEyeNativeX = 362.70;
                const rightEyeNativeY = 304.74;

                // Screen coordinates of the eye centers
                const eyeLeftX = cRect.left + (leftEyeNativeX * scale);
                const eyeLeftY = cRect.top + (leftEyeNativeY * scale);
                const eyeRightX = cRect.left + (rightEyeNativeX * scale);
                const eyeRightY = cRect.top + (rightEyeNativeY * scale);

                // Left Eye Angle & Distance Clamp
                const angleLeft = Math.atan2(mouse.y - eyeLeftY, mouse.x - eyeLeftX);
                const distanceLeft = Math.min(6, Math.hypot(mouse.x - eyeLeftX, mouse.y - eyeLeftY) * 0.06);
                pLeft.style.transform = `translate(${Math.cos(angleLeft) * distanceLeft}px, ${Math.sin(angleLeft) * distanceLeft}px)`;

                // Right Eye Angle & Distance Clamp
                const angleRight = Math.atan2(mouse.y - eyeRightY, mouse.x - eyeRightX);
                const distanceRight = Math.min(6, Math.hypot(mouse.x - eyeRightX, mouse.y - eyeRightY) * 0.06);
                pRight.style.transform = `translate(${Math.cos(angleRight) * distanceRight}px, ${Math.sin(angleRight) * distanceRight}px)`;
            }
            requestAnimationFrame(trackEyes);
        }

        requestAnimationFrame(trackEyes);
    </script>
</body>
</html>
